identifier_name:
    excluded: ["id", "a", "b", "c", "i", "j", "x", "y", "z"]

disabled_rules:
    - redundant_discardable_let
    - line_length
    - void_function_in_ternary

trailing_comma:
    mandatory_comma: true

opt_in_rules:
    - force_unwrapping

file_length:
    warning: 500
    error: 800
    ignore_comment_only_lines: true

type_body_length:
    warning: 300
    error: 500

function_body_length:
    warning: 60
    error: 100

excluded:
    - Firebase
    - Pods
    - .build
    - DerivedData
